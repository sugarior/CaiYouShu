server {
    listen 80;
    server_name 81.69.224.197;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/caiyoushu-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://81.69.224.197$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 81.69.224.197;

    ssl_certificate /etc/letsencrypt/live/81.69.224.197/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/81.69.224.197/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 40k;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8788;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
